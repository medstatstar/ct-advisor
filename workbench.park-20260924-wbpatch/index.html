<!DOCTYPE html>
<!-- ct-advisor 工作台 · 基于 ct-base 工作台标准框架（workbench_ui.md §5.4 多视图形态）构建 -->
<html lang="zh-CN" data-brand="clinical-indigo" data-page-node-id="fsBDfTRTyQDu5S9K6UUtXk">
<head data-page-node-id="pMq77fXUtzAV1wNIJzxux3">
<meta charset="UTF-8" data-page-node-id="C7JI9xNfq4VIjWSmz5wC0A" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" data-page-node-id="Mol4aXAjgMObc1KbFfj3PU" />
<title>ct-advisor · 临床试验总顾问工作台</title>
<link rel="stylesheet" href="./tokens.css" data-page-node-id="2OeWbGpAa92oudVZrkIS6t" />
<link rel="stylesheet" href="./wb-list.css" data-page-node-id="Cp5jn0CLZluqWUbBHiOoLt" />
<style>
  /* ===== advisor 特有布局（三视图 + 侧栏），一律用 --wb-* 令牌，禁止裸色/自造别名 ===== */
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; height:100%}
  body{
    font-family:var(--wb-font); color:var(--wb-ink);
    background:
      radial-gradient(1100px 620px at 88% -8%, rgba(28,109,208,.14), transparent 58%),
      radial-gradient(900px 560px at 0% 102%, rgba(91,155,213,.14), transparent 55%),
      linear-gradient(180deg, var(--wb-bg), var(--wb-bg-2));
    background-attachment:fixed; min-height:100vh; line-height:1.6;
  }
  .app{position:relative; z-index:1; display:flex; flex-direction:column; min-height:100vh}

  /* ---- 顶栏：品牌渐变实心条 + 控件反色（视觉三件套·其一） ---- */
  .topbar{
    display:flex; align-items:center; gap:14px; padding:12px var(--wb-pad);
    background:var(--wb-topbar-bg); border-bottom:1px solid rgba(255,255,255,.25);
    position:sticky; top:0; z-index:30;
  }
  .wb-brand{display:flex; align-items:center; gap:12px; min-width:0}
  .wb-brand svg{width:34px; height:34px; flex:0 0 auto; filter:drop-shadow(0 2px 4px rgba(0,0,0,.18))}
  .wb-brand h1{font-size:16px; margin:0; font-weight:700; letter-spacing:.3px; white-space:nowrap; color:var(--wb-topbar-ink)}
  .wb-brand .sub{font-size:11px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--wb-topbar-sub)}
  .spacer{flex:1}
  .top-actions{display:flex; align-items:center; gap:8px}
  .langbtn,.iconbtn{
    background:rgba(255,255,255,.12); color:var(--wb-topbar-ink); border:1px solid rgba(255,255,255,.35);
    border-radius:var(--wb-radius-sm); padding:8px 12px; font-size:13px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; min-height:40px; transition:.15s; font-family:inherit;
  }
  .langbtn:hover,.iconbtn:hover{background:rgba(255,255,255,.22); color:#fff; border-color:rgba(255,255,255,.55)}
  .pill{font-size:12px; font-weight:600; border-radius:var(--wb-radius-pill); padding:5px 12px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.15); color:var(--wb-topbar-ink); white-space:nowrap}
  .pill.ok{background:rgba(6,95,70,.55); border-color:rgba(110,231,183,.6); color:#fff}
  .pill.warn{background:rgba(180,83,9,.5); border-color:rgba(252,211,77,.55); color:#fff}
  .pill.err{background:rgba(185,28,28,.55); border-color:rgba(252,165,165,.6); color:#fff}

  .layout{display:flex; flex:1; min-height:0}
  /* ===== 简化版声明条（ct-base workbench_ui.md §17）===== */
  .wb-lite-notice{display:flex; align-items:center; gap:9px; flex-wrap:wrap;
    padding:8px var(--wb-pad); font-size:12.5px; line-height:1.55;
    background:var(--wb-brand-soft); color:var(--wb-brand-ink); border-bottom:1px solid var(--wb-line)}
  .wb-lite-notice svg{width:15px; height:15px; flex:0 0 auto; color:var(--wb-brand)}
  .wb-lite-notice .wb-lite-notice-t{flex:1; min-width:0}
  nav.side{width:212px; flex:0 0 auto; border-right:1px solid var(--wb-line); padding:14px 10px; background:var(--wb-panel); transition:width .16s ease, padding .16s ease; cursor:pointer}  /* 单击空白折叠（ct-base §5.4） */
  nav.side .navitem{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:var(--wb-radius-sm); cursor:pointer; color:var(--wb-sub); font-size:14px; margin-bottom:6px; border:1px solid transparent; transition:.15s; position:relative; white-space:nowrap}
  nav.side .navitem svg{width:18px; height:18px; flex:0 0 auto}
  nav.side .navitem:hover{color:var(--wb-ink); background:var(--wb-panel)}
  nav.side .navitem.active{color:var(--wb-brand); background:var(--wb-panel); border-color:var(--wb-line); font-weight:600}
  nav.side .navitem.locked{opacity:.38; pointer-events:none; filter:grayscale(.6)}
  .bottomtab .navitem.locked{opacity:.4; pointer-events:none}
  nav.side .navitem .badge{margin-left:auto; background:var(--wb-err); color:#fff; font-size:11px; border-radius:var(--wb-radius-pill); padding:1px 7px; font-weight:700}
  /* 侧栏折叠（桌面端；ct-base §5.4 多视图导航可折叠）——触发：单击导航栏空白处（点中 .navitem 不触发），无独立折叠钮 */
  .app.side-collapsed nav.side{width:62px; padding:14px 8px}
  .app.side-collapsed nav.side .navitem{justify-content:center; gap:0; padding:11px 0}
  .app.side-collapsed nav.side .navitem span{display:none}
  .app.side-collapsed nav.side .navitem .badge{position:absolute; top:3px; right:3px; margin:0; min-width:17px; height:17px; line-height:15px; padding:0 4px; font-size:10px; text-align:center}
  .app.side-collapsed nav.side .navitem:hover{background:var(--wb-bg)}
  main{flex:1; min-width:0; padding:18px var(--wb-pad) 40px; overflow:auto}
  .view{display:none; animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .card{background:var(--wb-panel); border:1px solid var(--wb-line); border-radius:var(--wb-radius); padding:16px; box-shadow:var(--wb-shadow-sm)}
  .card+.card{margin-top:14px}
  .card h2{margin:0 0 12px; font-size:15px; display:flex; align-items:center; gap:8px; color:var(--wb-ink)}
  .card h2 .dot{width:8px; height:8px; border-radius:2px; background:var(--wb-brand); box-shadow:0 0 8px var(--wb-brand-2)}
  .pending-strip{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px}
  .pending-chip{flex:0 0 auto; min-width:210px; border:1px solid var(--wb-err); border-radius:var(--wb-radius-sm); padding:10px 12px; cursor:pointer; background:rgba(220,38,38,.06); transition:.15s}
  .pending-chip:hover{border-color:var(--wb-brand); box-shadow:0 3px 12px rgba(28,109,208,.15)}
  .pending-chip .t{font-size:12px; color:var(--wb-err); font-weight:700; display:flex; align-items:center; gap:6px}
  .pending-chip .s{font-size:12px; color:var(--wb-ink); margin-top:4px; font-family:var(--wb-mono)}
  .chatlog{display:flex; flex-direction:column; gap:10px; margin-top:16px; padding:14px; background:var(--wb-bg); border:1px solid var(--wb-line); border-radius:var(--wb-radius)}  /* 对话面板：与上方操作区界限分明 */
  .msg{position:relative; border-radius:var(--wb-radius); padding:12px 15px; border:1px solid var(--wb-line); animation:fadeup .18s ease}
  .msg.user{align-self:flex-end; width:auto; max-width:82%; margin-left:auto; background:linear-gradient(135deg, var(--wb-brand-soft), rgba(21,92,168,.10)); border-color:rgba(28,109,208,.30)}
  .msg.bot{align-self:stretch; width:100%; background:var(--wb-panel); border-color:var(--wb-line-soft); box-shadow:0 1px 0 rgba(255,255,255,.65) inset, 0 2px 10px rgba(15,37,53,.04)}
  .msg.bot.err{background:rgba(220,38,38,.06); border-color:var(--wb-err); box-shadow:none}
  .msg.bot.err .body{color:var(--wb-err)}
  .msg .who{font-size:11px; color:var(--wb-sub); margin-bottom:7px; display:flex; gap:7px; align-items:center; flex-wrap:wrap; line-height:1}
  .msg .who .ava{width:16px; height:16px; border-radius:6px; flex:0 0 auto; display:inline-block}
  .msg .who .nm{font-size:12px; font-weight:700; letter-spacing:.2px}
  .msg.user .who .nm{color:#14509B}
  .msg.bot .who .nm{color:var(--wb-brand)}
  .msg .who .tm{margin-left:auto; font-size:10.5px; font-family:var(--wb-mono); opacity:.75}
  .msg .who .tag{font-family:var(--wb-mono); border:1px solid var(--wb-line); background:rgba(255,255,255,.55); border-radius:var(--wb-radius-pill); padding:1.5px 8px; color:var(--wb-brand-ink); font-size:10.5px; line-height:1.4}
  .msg .body{font-size:14px; white-space:pre-wrap; word-break:break-word; color:var(--wb-ink); line-height:1.7}
  .msg .body table{border-collapse:collapse; margin:10px 0; width:100%; font-size:13px; border-radius:10px; overflow:hidden; box-shadow:0 1px 0 var(--wb-line)}
  .msg .body th,.msg .body td{border:1px solid var(--wb-line); padding:7px 10px; text-align:left; vertical-align:top}
  .msg .body th{background:linear-gradient(180deg, var(--wb-brand-soft), rgba(28,109,208,.10)); color:var(--wb-brand-ink); font-weight:700; border-bottom:1px solid rgba(28,109,208,.4)}
  .msg .body tr:nth-child(even) td{background:rgba(91,155,213,.05)}
  .msg .body td strong{color:#123F73}
  .msg .body code{font-family:var(--wb-mono); background:rgba(91,155,213,.12); border:1px solid rgba(91,155,213,.18); padding:1px 6px; border-radius:6px; font-size:12.5px; color:#0b4f6b}
  .msg .body pre{background:#10242f; border:1px solid rgba(15,37,53,.2); border-radius:12px; padding:12px 14px; overflow:auto; margin:10px 0}
  .msg .body pre code{background:none; border:none; padding:0; color:#d7e7ef; font-size:12.5px; line-height:1.65; display:block}
  .msg .body h1,.msg .body h2,.msg .body h3{margin:16px 0 7px; color:var(--wb-brand); line-height:1.4; font-weight:800}
  .msg .body h1:first-child,.msg .body h2:first-child,.msg .body h3:first-child{margin-top:2px}
  .msg .body h2,.msg .body h3{display:flex; align-items:center; gap:8px}
  .msg .body h2::before,.msg .body h3::before{content:""; width:4px; height:1em; border-radius:3px; background:linear-gradient(180deg, var(--wb-brand), var(--wb-brand-2)); flex:0 0 auto}
  .msg .body h1{font-size:16px} .msg .body h2{font-size:15px} .msg .body h3{font-size:14px}
  .msg .body a{color:var(--wb-brand-ink); font-weight:600; text-decoration:underline; text-underline-offset:2px}
  .msg .body ul,.msg .body ol{margin:8px 0; padding-left:22px}
  .msg .body li{margin:3px 0}
  .msg .body li::marker{color:var(--wb-brand)}
  .msg .body blockquote{border-left:4px solid var(--wb-brand); background:rgba(28,109,208,.07); margin:10px 0; padding:8px 14px; color:var(--wb-ink); border-radius:0 10px 10px 0}
  .msg .body blockquote p{margin:0}
  .msg .body hr{border:none; border-top:1px dashed var(--wb-line-soft); margin:14px 0}
  .typing{display:inline-flex; gap:4px; align-items:center}
  .typing i{width:7px; height:7px; border-radius:50%; background:var(--wb-brand); display:inline-block; animation:blink 1s infinite}
  .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  @keyframes fadeup{from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:none}}

  /* ---- 输入区：品牌软底交叉（视觉三件套·其三） ---- */
  .composer{position:sticky; top:0; z-index:5; margin-top:12px; background:var(--wb-brand-soft); border:1px solid var(--wb-line); border-radius:var(--wb-radius); padding:10px; box-shadow:0 10px 18px -12px rgba(15,37,53,.28)}  /* 与下方对话面板形成界限 */
  .composer textarea{width:100%; resize:vertical; min-height:96px; max-height:320px; background:var(--wb-panel); color:var(--wb-ink); border:1px solid var(--wb-line); border-radius:var(--wb-radius-sm); padding:10px 12px; font-family:var(--wb-font); font-size:14px; line-height:1.5}
  .composer textarea:focus{outline:none; border-color:var(--wb-brand)}
  .attachrow{display:flex; gap:10px; align-items:stretch; margin-top:6px}
  .filechip{flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--wb-panel); color:var(--wb-sub); border:1px dashed var(--wb-line); border-radius:10px; padding:0 13px; font-size:12.5px; font-family:var(--wb-font); cursor:pointer; white-space:nowrap; user-select:none}
  .filechip:hover{border-color:var(--wb-brand); color:var(--wb-brand)}
  .composer .attach{flex:1; width:auto; min-width:0; background:var(--wb-panel); color:var(--wb-sub); border:1px dashed var(--wb-line); border-radius:10px; padding:7px 11px; font-size:12.5px; font-family:var(--wb-font); resize:vertical; min-height:50px}
  .sendmeta{display:flex; align-items:center; gap:10px; font-size:11px; color:var(--wb-muted); min-width:0; flex-wrap:wrap}
  .sendbtn{background:linear-gradient(135deg, var(--wb-brand), var(--wb-brand-2)); color:#fff; border:none; border-radius:11px; padding:0 22px; min-height:40px; font-weight:700; font-size:13.5px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px; transition:background .25s, box-shadow .25s, transform .08s; font-family:inherit; box-shadow:0 3px 12px rgba(28,109,208,.22)}
  .sendbtn:hover{filter:brightness(1.07)}
  .sendbtn .sendIcon svg{width:16px; height:16px}
  .sendbtn:active{transform:scale(.96)}
  .sendbtn:disabled{opacity:.7; cursor:not-allowed}
  .sendbtn .sendIcon{display:inline-flex}
  .sendbtn .spin{width:16px; height:16px; border:2px solid rgba(255,255,255,.45); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sendbtn.loading .sendIcon{display:none}
  .sendbtn.loading .spin{display:inline-block}
  .sendbtn.sent{background:linear-gradient(135deg,#16a34a,#15803d); box-shadow:0 6px 18px rgba(22,163,74,.35)}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px; font-size:12px; color:var(--wb-sub)}
  .toolbar .switch{margin-right:auto}
  .toolbar select,.toolbar label{display:inline-flex; align-items:center; gap:6px}
  .toolbar select{background:var(--wb-panel); color:var(--wb-ink); border:1px solid var(--wb-line); border-radius:8px; padding:6px 8px; font-size:12.5px; font-family:inherit}
  .switch{display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none}
  .switch input{display:none}
  .switch .track{width:36px; height:20px; border-radius:var(--wb-radius-pill); background:var(--wb-panel); border:1px solid var(--wb-line); position:relative; transition:.15s}
  .switch .track::after{content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--wb-sub); transition:.15s}
  .switch input:checked + .track{background:var(--wb-brand-soft); border-color:var(--wb-brand)}
  .switch input:checked + .track::after{left:18px; background:var(--wb-brand)}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px}
  .qcard{border:1px solid var(--wb-line); border-radius:var(--wb-radius-sm); padding:14px; background:var(--wb-panel); cursor:pointer; transition:.15s; display:flex; flex-direction:column}
  .qcard:hover{border-color:var(--wb-brand); transform:translateY(-2px); box-shadow:0 6px 18px rgba(28,109,208,.14)}
  .qcard .ic{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--wb-brand-soft); color:var(--wb-brand); margin-bottom:10px}
  .qcard .ic svg{width:20px; height:20px}
  .qcard .ti{font-size:14px; font-weight:600; color:var(--wb-ink)}
  .qcard .de{font-size:12px; color:var(--wb-sub); margin-top:4px; flex:1}
  .qcard .route{font-size:11px; color:var(--wb-brand-ink); margin-top:8px; font-family:var(--wb-mono)}

  /* ---- 历史卡片（WBList 卡片行模板容器） ---- */
  #wb-hist-list{margin-top:4px}
  .hist-q{font-size:13.5px; font-weight:600; color:var(--wb-ink)}
  .hist-m{font-size:11px; color:var(--wb-sub); margin-top:5px; font-family:var(--wb-mono); display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .hist-a{font-size:12.5px; color:var(--wb-sub); margin-top:6px}
  .btnbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
  .ghostbtn{background:var(--wb-panel); color:var(--wb-ink); border:1px solid var(--wb-line); border-radius:var(--wb-radius-sm); padding:8px 12px; font-size:12.5px; cursor:pointer; font-family:inherit}
  .ghostbtn:hover{border-color:var(--wb-brand); color:var(--wb-brand)}
  .ghostbtn.danger:hover{border-color:var(--wb-err); color:var(--wb-err)}
  .empty{color:var(--wb-sub); text-align:center; padding:30px; font-size:13px}

  .drawer-mask,.modal-mask{position:fixed; inset:0; background:rgba(15,30,45,.4); z-index:40; display:none}
  .drawer-mask.open,.modal-mask.open{display:block}
  .drawer{position:fixed; top:0; right:0; height:100%; width:min(380px,92vw); background:var(--wb-panel); border-left:1px solid var(--wb-line); z-index:41; transform:translateX(100%); transition:.22s; padding:18px; overflow:auto}
  .drawer.open{transform:none}
  .drawer h3{margin:0 0 14px; font-size:15px; display:flex; align-items:center; justify-content:space-between; color:var(--wb-ink)}
  .modal{position:fixed; top:50%; left:50%; transform:translate(-50%,-46%); width:min(560px,94vw); max-height:88vh; overflow:auto; background:var(--wb-panel); border:1px solid var(--wb-line); border-radius:var(--wb-radius-lg); z-index:41; padding:18px 20px; opacity:0; transition:.2s; box-shadow:var(--wb-shadow)}
  .modal.open{opacity:1; transform:translate(-50%,-50%)}
  .modal h3{margin:0 0 4px; font-size:16px; display:flex; align-items:center; justify-content:space-between; color:var(--wb-ink)}
  .modal .closex{cursor:pointer; color:var(--wb-sub); border:1px solid var(--wb-line); border-radius:8px; padding:4px 9px; background:var(--wb-panel); display:inline-flex}
  .modal .closex:hover{border-color:var(--wb-brand); color:var(--wb-brand)}
  .modal .mde{font-size:12px; color:var(--wb-sub); margin:0 0 12px}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:12.5px; color:var(--wb-sub); margin-bottom:6px; font-weight:600}
  .field input,.field select,.field textarea{width:100%; background:var(--wb-panel); color:var(--wb-ink); border:1px solid var(--wb-line); border-radius:var(--wb-radius-sm); padding:10px 12px; font-size:13px; font-family:var(--wb-font)}
  .field textarea{resize:vertical; min-height:60px; font-family:var(--wb-mono)}
  .field .hint{font-size:11px; color:var(--wb-sub); margin-top:5px}
  .field .req{color:var(--wb-err); margin-left:3px}
  .cmdbox{background:rgba(15,37,53,.06); border:1px solid var(--wb-line); border-radius:10px; padding:10px 12px; font-family:var(--wb-mono); font-size:12.5px; color:#123F73; white-space:pre-wrap; word-break:break-word; margin:8px 0}
  .refbox{border:1px solid var(--wb-line-soft); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--wb-ink); background:rgba(91,155,213,.06); margin:8px 0}
  .refbox a{color:var(--wb-brand-ink); font-weight:600; word-break:break-word}
  .engine-badge{display:inline-block; font-size:11px; padding:2px 9px; border-radius:var(--wb-radius-pill); border:1px solid var(--wb-line); color:var(--wb-brand); background:var(--wb-brand-soft); font-family:var(--wb-mono)}
  .bottomtab{display:none; position:fixed; bottom:0; left:0; right:0; z-index:35; background:var(--wb-panel); backdrop-filter:blur(10px); border-top:1px solid var(--wb-line); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); justify-content:space-around}
  .bottomtab .navitem{flex-direction:column; gap:3px; font-size:10px; padding:6px 4px; margin:0; border:none; background:none; min-height:auto; color:var(--wb-sub); display:flex; align-items:center; cursor:pointer}
  .bottomtab .navitem svg{width:20px; height:20px}
  .bottomtab .navitem.active{color:var(--wb-brand); font-weight:600}
  .bottomtab .navitem .badge{position:absolute; top:2px; right:50%; transform:translateX(14px); background:var(--wb-err); color:#fff}
  .toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--wb-panel); border:1px solid var(--wb-brand); color:var(--wb-ink); padding:10px 16px; border-radius:10px; font-size:13px; z-index:60; opacity:0; transition:.2s; max-width:90vw; text-align:center; box-shadow:var(--wb-shadow)}
  .toast.show{opacity:1}
  .toast.err{border-color:var(--wb-err); color:var(--wb-err)}
  .row-btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}

    build:(v,T)=> (v.q||"") + (v.attach? ("\n\n[附件]\n"+v.attach):"")

  samplesize:{ category:"statistics", accuracy:"good",
    fields:[

      {key:"p1", type:"num", label:{zh:"p1（对照组率）", en:"p1 (control rate)"}},

      {key:"effect", type:"num", label:{zh:"效应量（均值差）", en:"Effect (mean diff)"}},

    build:(v,T)=>{ const parts=[T.zh?"请估算样本量 / 效能：":""];
      if(v.test) parts.push("检验="+v.test);
      if(v.p1!=="") parts.push("p1="+v.p1); if(v.p2!=="") parts.push("p2="+v.p2);
      if(v.effect!=="") parts.push("effect="+v.effect); if(v.sd!=="") parts.push("sd="+v.sd);
      if(v.margin!=="") parts.push("margin="+v.margin);
      if(v.alpha!==""&&v.alpha!==null) parts.push("alpha="+v.alpha);
      if(v.power!==""&&v.power!==null) parts.push("power="+v.power);
      if(v.side) parts.push("side="+v.side);
      if(v.k_groups&&v.k_groups!=2) parts.push("k="+v.k_groups);
      return parts.join("，")+"。";
    }

function cliCmd(tool, params){

    "ct-registry":{cond:"--cond",intr:"--intr",sponsor:"--sponsor",status:"--status",max:"--max",drug:"--drug",with_cde:"--with-cde",cde_keyword:"--cde-keyword"},

  }[tool] || {};

function getQid(){
  const existing = localStorage.getItem(LS.qid); if(existing) return existing;
  const sig = [ navigator.userAgent||"", screen.width+"x"+screen.height, navigator.hardwareConcurrency||"", Intl.DateTimeFormat().resolvedOptions().timeZone||"", (navigator.language||"") ].join("|");
  let h1=0x811c9dc5, h2=0x1000193;
  for(let i=0;i<sig.length;i++){ const c=sig.charCodeAt(i); h1=((h1^c)*0x01000193)>>>0; h2=((h2^(c+1))*0x85ebca6b)>>>0; }
  const id="env:"+h1.toString(16).padStart(8,"0")+h2.toString(16).padStart(8,"0");
  localStorage.setItem(LS.qid, id); return id;
}

// §性能（ct-base workbench_perf.md ④）：增量渲染——仅新增条目 append，不整表重建；
// 仅 init/导入/删除/清空/切语言 走 full 全量。配合下方 _mdCache 缓存 md2html，历史重渲染近乎零成本。
let _chatSeq = 0;
let _histDirty = false;
const _chatNodes = new Map(); // _id -> {user:Node, bot:Node|null}
function _bubbleBot(h){ return bubble("bot", h.answer, h.meta, h.need_tool? h:{need_tool:null}, h.error, h.ts, h); }
function _syncChatEntry(h){
  const log = document.getElementById("chatlog");
  if(!log) return;
  let rec = _chatNodes.get(h._id);
  if(!rec){
    const user = bubble("user", h.q, h.meta, null, false, h.ts);
    const bot = (h.answer!=null && h.answer!==undefined) ? _bubbleBot(h) : null;
    rec = {user, bot}; _chatNodes.set(h._id, rec);
    log.insertBefore(rec.user, log.firstChild);
    if(rec.bot) log.insertBefore(rec.bot, rec.user.nextSibling);
  } else if(!rec.bot && h.answer!=null && h.answer!==undefined){
    rec.bot = _bubbleBot(h);
    log.insertBefore(rec.bot, rec.user.nextSibling);
  }
}
function renderChat(opts){
  const log = document.getElementById("chatlog");
  if(!log) return;
  const full = !opts || opts.full;
  if(state.hist.length===0){ log.innerHTML=`<div class="empty">${esc(t().histEmpty)}</div>`; _chatNodes.clear(); return; }
  if(full){ log.innerHTML=""; _chatNodes.clear(); }
  const entries = state.hist.slice().reverse(); // 最新在前
  for(const h of entries){
    if(!full && _chatNodes.has(h._id)) continue;
    _syncChatEntry(h);
  }
}
function fmtTime(ts){ try{ return new Date(ts||Date.now()).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }catch(e){ return ""; } }
function bubble(role, text, meta, extra, isErr, ts, msgObj){
  const T=t(); const d=document.createElement("div"); d.className="msg "+role+(isErr? " err":"");
  const who = role==="user"? T.you : T.bot;
  const ava = role==="user" ? "#14509B" : "#1C6DD0";
  let metaHtml="";
  if(meta){ const tags=[];
    if(extra && extra.need_tool) tags.push(`<span class="tag" style="color:var(--wb-err);border-color:var(--wb-err)">${esc(T.needTool)}: ${esc(extra.need_tool)}</span>`);
    if(meta.cached) tags.push(`<span class="tag">${esc(T.cached)}</span>`);
    if(meta.runId) tags.push(`<span class="tag">${esc(T.runId)}: ${esc(String(meta.runId).slice(0,8))}</span>`);
    metaHtml = tags.join(" ");
  }
  const tm = fmtTime(ts);
  // §20.15：Coze 顶层 message 字段 → 置顶可关闭 banner（仅承载表面提示）
  let bannerHtml="";
  if(role==="bot" && msgObj && msgObj.message){
    const m=msgObj.message; const lvl=m.level||"notice";
    const icon={tip:"💡",info:"ℹ️",notice:"📌",warning:"⚠️"}[lvl]||"📌";
    const label={tip:"提示",info:"说明",notice:"提示",warning:"提醒"}[lvl]||"提示";
    const dis=(m.dismissible!==false);
    bannerHtml=`<div class="coze-msg" style="display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:6px 10px;border-radius:8px;background:rgba(28,109,208,.10);border:1px solid rgba(28,109,208,.25);font-size:13px;color:var(--wb-tx,#222)"><span style="font-size:14px">${icon}</span><b style="font-weight:600">${esc(label)}</b><span style="flex:1">${esc(m.text)}</span>${dis? '<button class="coze-msg-dismiss" style="margin-left:6px;border:none;background:transparent;cursor:pointer;font-size:15px;color:#888" title="隐藏提示">×</button>':''}</div>`;
  }
  // 缓存来源声明（2026-09-09，彤 规范）：命中云计算缓存 → 答案上方明示，非本次实时计算
  let cacheDeclHtml="";
  if(role==="bot" && meta && meta.cached){
    const zh=(document.documentElement.lang||"").indexOf("zh")===0;
    const txt=zh? "本答案来自云计算缓存（历史运行结果，非本次实时计算）。如需最新结果，请追问要求重新生成。" : "This answer is from the cloud cache (a previous run, not freshly computed for this request). Ask again for a fresh generation if needed.";
    cacheDeclHtml=`<div style="margin-bottom:6px;font-size:12px;color:#a16207;background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.35);border-radius:6px;padding:4px 8px">📦 ${esc(txt)}</div>`;
  }
  d.innerHTML=`<div class="who"><span class="ava" style="background:${ava}"></span><span class="nm">${esc(who)}</span>${metaHtml}<span class="tm">${esc(tm)}</span></div><div class="body">${cacheDeclHtml}${bannerHtml}${role==="bot"? md2html(text||"") : esc(text)}</div>`;
  if(role==="bot" && msgObj && msgObj.message){
    const bd=d.querySelector(".coze-msg-dismiss");
    if(bd) bd.onclick=()=>{ const el=d.querySelector(".coze-msg"); if(el) el.style.display="none"; };
  }
  return d;
}
function lastTurns(n){
  const out=[]; const arr=state.hist.slice().reverse();
  for(const h of arr){ if(h.answer){ out.push({role:"user",content:h.q}); out.push({role:"assistant",content:h.answer}); } if(out.length>=n*2) break; }
  return out.slice(0,n*2);
}
function extractAnswer(data){
  if(typeof data==="string") return data.trim();
  if(!data || typeof data!=="object") return "";
  const cand=[ data.final_answer, data.result, data.answer, data.content, data.output, data.text, data.reply, data.response,
    data.data && (data.data.final_answer ?? data.data.answer ?? data.data.content ?? data.data.text ?? data.data.output) ];
  for(const c of cand){ if(c===undefined||c===null||c==="") continue; if(typeof c==="string") return c.trim(); if(typeof c==="object"){ const s=extractAnswer(c); if(s) return s; } }
  return "";
}
function stripDelimiters(s){
  if(typeof s!=="string"||!s) return s;
  return s.replace(/<<<CT_ANSWER_START>>>/g, "").replace(/<<<CT_ANSWER_END>>>/g, "").replace(/^\s*[\r\n]+|[\r\n]+\s*$/g, "");
}
function detectVague(q){
  const s=(q||"").trim(); if(!s) return false;
  if(/(这个|那个|它|它们|这|那|这种|那些|该药|该方案)/.test(s) && s.length<=24) return true;
  if(/(前面|上面|刚才|上一条|上一个|上轮|上次|之前提到|前述|上述)/.test(s) && s.length<=30) return true;
  if(s.length<=8 && !/(SDTM|ADaM|AE|SAE|CSR|TLF|CRF|EDC|GCP|CDISC|ADSL|BDS|OCCDS|ADTTE|PK|PD|MedDRA|WHO|ICF|SUSAR|DSUR|RBM|QbD|ALCOA|IB|SAP|什么是|的定义|含义|如何|步骤|流程|时限|保存|填写|提交|上报|复核|正确|规范|要求|记录|报告|破盲|回收|发放)/i.test(s)) return true;
  const uncertain=/(不确定|不清楚|不知道|没想好|拿不准|没有头绪|not sure|unsure|don'?t know|no idea|not clear)/i.test(s);
  const hasObject=/(是否|能不能|可不可以|对不对|合理|合规|正确|appropriate|valid|acceptable|\bif\b)/i.test(s);
  if(uncertain && !hasObject) return true;
  return false;
}

function normalizeCozeMessage(raw){
  if(!raw) return null;
  if(typeof raw==="string"){ raw=raw.trim(); return raw? {level:"notice", text:raw, dismissible:true}:null; }
  if(Array.isArray(raw)){ const parts=[]; raw.forEach(it=>{ const s=normalizeCozeMessage(it); if(s&&s.text) parts.push(s.text); }); return parts.length? {level:"notice", text:parts.join("\n"), dismissible:true}:null; }
  if(typeof raw==="object"){ const text=(typeof raw.text==="string")? raw.text.trim():""; if(!text) return null; const lv=raw.level; const level=(["tip","info","notice","warning"].indexOf(lv)>=0)? lv:"notice"; const dis=(typeof raw.dismissible==="boolean")? raw.dismissible:true; return {level, text, dismissible:dis}; }
  return null;
}
async function sendToCoze(q, att, opts){
  const T=t();
  if(!isHttpOrigin()){
    const pill=document.getElementById("connPill"); pill.className="pill warn"; pill.textContent=T.connProxy; pill.title=T.bannerExternal;
    toast(T.connProxy); return;
  }
  const continuous=opts.continuous;
  const cur={_id: ++_chatSeq, q, answer:null, meta:{difficulty:opts.difficulty, cached:false, runId:"", skill:opts.meta&&opts.meta.skill||null}, need_tool:null, params:{}, ts:Date.now(), sample:false};
  _histDirty = true;
  state.hist.push(cur); renderChat(); scrollChat();
  const log=document.getElementById("chatlog");
  const typing=document.createElement("div"); typing.className="msg bot";
  typing.innerHTML=`<div class="who"><span class="ava" style="background:#1C6DD0"></span><span class="nm">${esc(T.bot)}</span></div><div class="body"><span class="typing"><i></i><i></i><i></i></span></div>`;
  const firstUser=log.querySelector(".msg.user");
  if(firstUser && firstUser.nextSibling) log.insertBefore(typing, firstUser.nextSibling); else log.appendChild(typing);
  scrollChat(); setBtnLoading(T);
  const payload={ query_meta:{ difficulty:opts.difficulty, category:opts.category||"", accuracy:opts.accuracy||"", query_origin:getQid(), locale: state.cfg.locale || state.lang },
    original_question: att? (q+"\n\n[附件]\n"+att) : q, draft_answer:"", conversation_history: continuous? lastTurns(10):[] };
  try{
    const headers={"Content-Type":"application/json"};
    if(state.cfg.token) headers["Authorization"]="Bearer "+state.cfg.token;
    const resp=await fetch(state.cfg.endpoint, {method:"POST", headers, body:JSON.stringify(payload)});
    if(!resp.ok){ const _t=await resp.text(); throw new Error(T.errHttp+resp.status+(_t? "："+_t.slice(0,200):"")); }
    const data = await readCozeResponse(resp, cur, typing, T); // §性能 ④/传输 + B轴3.1：流式直读；非 SSE 退化为原 JSON 行为
    const bizErr = (data && typeof data==="object")? (data.error||data.message||data.msg||"") : "";
    const answer = extractAnswer(data);
    if(!answer){ cur.answer = bizErr? String(bizErr) : T.errEmpty; cur.error = true; }
    else{ cur.answer = stripDelimiters(answer); cur.need_tool = data.need_tool || null; cur.params = data.params || {}; cur.meta.cached = !!data.cache_hit; cur.meta.runId = data.run_id || ""; }
    cur.message = normalizeCozeMessage(data.message);  // §20.15：置顶提示（可关闭）
    saveHist(); typing.remove(); renderChat(); renderPending(); updateBadge();
    if(cur.error){ resetBtn(T); } else { setBtnSent(T); setTimeout(()=>resetBtn(t()), 1300); }
  }catch(e){
    typing.remove(); cur.answer = (e instanceof TypeError)? T.errNet : (T.errHttp + e.message); cur.error=true;
    saveHist(); renderChat();
    const pill=document.getElementById("connPill"); pill.className="pill err"; pill.textContent=T.connErr;
    pill.title = (e instanceof TypeError)? T.bannerExternal : (T.bannerWarn+" run_app.bat");
    resetBtn(T);
  }finally{ scrollChat(); }
}
// §性能 ④/传输 + B轴3.1 页面侧：流式直读 Coze 响应。
// - 端点返回 text/event-stream → 逐块更新气泡（首字即显，20s 等待"消失"）；
// - 否则（当前 ct-advisor /run 返回单个 JSON）→ 退化为原 await resp.text()+JSON.parse，零回归。
async function readCozeResponse(resp, cur, typing, T){
  const ctype = resp.headers.get("content-type")||"";
  if(ctype.includes("text/event-stream")){
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    const log = document.getElementById("chatlog");
    let buf="", live=null, lastAnswer="";
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += decoder.decode(value, {stream:true});
      const parts = buf.split("\n\n"); buf = parts.pop();
      for(const ev of parts){
        for(const line of ev.split("\n")){
          if(!line.startsWith("data:")) continue;
          const payload = line.slice(5).trim();
          if(!payload || payload==="[DONE]") continue;
          try{
            const obj = JSON.parse(payload);
            const delta = (obj.choices&&obj.choices[0]&&obj.choices[0].delta&&obj.choices[0].delta.content) || extractAnswer(obj) || "";
            if(delta){
              if(!live){ if(typing) typing.remove(); live=document.createElement("div"); live.className="msg bot";
                live.innerHTML=`<div class="who"><span class="ava" style="background:#1C6DD0"></span><span class="nm">${esc(T.bot)}</span></div><div class="body"></div>`;
                const fu = log? log.querySelector(".msg.user"):null; if(log) log.insertBefore(live, fu? fu.nextSibling : null); }
              lastAnswer += delta;
              live.querySelector(".body").innerHTML = md2html(lastAnswer);
              scrollChat();
            }
          }catch(_){ /* 非 JSON 增量，忽略 */ }
        }
      }
    }
    if(live && log) live.remove(); // 交给后续 renderChat 重建正式气泡（含缓存声明/置顶提示）
    return lastAnswer ? {final_answer:lastAnswer} : {};
  }
  const text = await resp.text();
  if(ctype.includes("json")){ try{ return JSON.parse(text); }catch(_){ return text; } }
  return text;
}

/* markdown -> html (safe) */
const _mdCache = new Map(); // §性能 ④：(text,lang) -> html，避免历史全量重解析
const _MD_CACHE_MAX = 500;
function md2html(src){
  if(src==null) return "";
  const _k = (state.lang||"zh") + " " + src;
  const _hit = _mdCache.get(_k);
  if(_hit!==undefined) return _hit;
  const _html = _md2htmlImpl(src);
  if(_mdCache.size >= _MD_CACHE_MAX) _mdCache.clear();
  _mdCache.set(_k, _html);
  return _html;
}
function _md2htmlImpl(src){
  if(src==null) return "";
  const escSrc=esc(src).replace(/\r/g,"");
  const lines=escSrc.split(/\n/); let html=""; let i=0;
  const closeLists=()=>{ if(_ul){html+="</ul>";_ul=false;} if(_ol){html+="</ol>";_ol=false;} if(_blk){html+="</blockquote>";_blk=false;} };
  let _ul=false,_ol=false,_blk=false,_code=false; let codeBuf=[]; let tableBuf=[];
  const isTableRow=ln=>/^\s*\|.*\|\s*$/.test(ln);
  const isSepRow=ln=>{ const body=ln.replace(/^\s*\|/,"").replace(/\|\s*$/,""); const cells=body.split("|").map(c=>c.trim()); return cells.length>0 && cells.every(c=>/^:?-{2,}:?$/.test(c)); };
  const flushTable=()=>{ if(!tableBuf.length) return; const rows=tableBuf.slice(); tableBuf=[];
    if(rows.length>=2 && isSepRow(rows[1])) rows.splice(1,1);
    const splitRow=ln=>ln.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
    if(rows.length){ html+="<table><thead><tr>"+splitRow(rows[0]).map(c=>`<th>${inline(c)}</th>`).join("")+"</tr></thead><tbody>";
      for(let k=1; k<rows.length; k++) html+="<tr>"+splitRow(rows[k]).map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>"; html+="</tbody></table>"; } };
  for(;i<lines.length;i++){ let ln=lines[i];
    if(/^```/.test(ln)){ if(_code){ html+="<pre><code>"+codeBuf.join("\n")+"</code></pre>"; codeBuf=[]; _code=false; } else { closeLists(); flushTable(); _code=true; } continue; }
    if(_code){ codeBuf.push(ln); continue; }
    if(isTableRow(ln)){ closeLists(); tableBuf.push(ln); continue; }
    if(tableBuf.length){ flushTable(); }
    if(/^#{1,3}\s/.test(ln)){ closeLists(); const lv=ln.match(/^#+/)[0].length; html+=`<h${lv}>${inline(ln.replace(/^#+\s/,""))}</h${lv}>`; continue; }
    if(/^>\s?/.test(ln)){ if(!_blk){closeLists();html+="<blockquote>";_blk=true;} html+=`<p>${inline(ln.replace(/^>\s?/,""))}</p>`; continue; }
    if(/^\s*[-*]\s/.test(ln)){ if(!_ul){closeLists();html+="<ul>";_ul=true;} html+=`<li>${inline(ln.replace(/^\s*[-*]\s/,""))}</li>`; continue; }
    if(/^\s*\d+\.\s/.test(ln)){ if(!_ol){closeLists();html+="<ol>";_ol=true;} html+=`<li>${inline(ln.replace(/^\s*\d+\.\s/,""))}</li>`; continue; }
    if(/^\s*(---+|\*\*\*+)\s*$/.test(ln)){ closeLists(); html+="<hr>"; continue; }
    if(ln.trim()===""){ closeLists(); continue; }
    closeLists(); html+=`<p>${inline(ln)}</p>`;
  }
  flushTable(); if(_code) html+="<pre><code>"+codeBuf.join("\n")+"</code></pre>"; closeLists(); return html;
  function inline(s){ let out=s; out=out.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, (m,tx,url)=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${tx}</a>`);
    return out.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>").replace(/`([^`]+)`/g,"<code>$1</code>"); }
}

// 异步读取 workbench.config.json（端点）+ /api/config（token：前端私有 LLM key，留空则用户在设置框填写）
async function loadRemoteDefaults(){
  try{
    const r=await fetch("workbench.config.json", {cache:"no-store"});
    if(r.ok){ const j=await r.json(); if(j.backend && j.backend.remoteEndpoint) REMOTE_DEFAULT.endpoint=j.backend.remoteEndpoint; }
  }catch(e){ /* file:// 直开无 server，用硬编码默认 */ }
  try{
    const r2=await fetch("/api/config", {cache:"no-store"});
    if(r2.ok){ const j2=await r2.json(); if(j2.token) REMOTE_DEFAULT.token=j2.token; }
  }catch(e){ /* 离线：无 /api/config 时回退空 token（由设置框手动填入） */ }
}
function refreshAll(){
  loadLang();
  loadRemoteDefaults().then(()=>{
    loadCfg(); loadHist();
    if(SKILLS_LOCKED) document.querySelectorAll('[data-view="skills"]').forEach(n=>n.classList.add("locked"));
    if(state.hist.length===0) seedSamples();
    applyLang(); renderChat(); renderPending(); updateBadge();
    document.getElementById("qinput").addEventListener("input", ()=>{ document.getElementById("charHint").textContent = document.getElementById("qinput").value.length + " " + t().charHint; });
    document.getElementById("charHint").textContent="0 "+t().charHint;
    if(window.wbHistory) window.wbHistory.rerender();
  }).catch(e=>{ console.error("refreshAll:", e); });
}
function setConnState(ok, T, reason){
  lastConnOk = ok;
  const pill=document.getElementById("connPill");
  pill.className = "pill " + (ok? "ok":"warn");
  pill.textContent = ok? T.connOk : T.connProxy;
  // 启动指引并入 pill title（仅异常态）；避免与页内横幅双处提醒
  pill.title = ok? "" : ((reason==="external" || reason==="timeout")? T.bannerExternal : (T.bannerWarn + " run_app.bat"));
}
function isHttpOrigin(){ const p=(location.protocol||"").toLowerCase(); return p==="http:" || p==="https:"; }
async function checkProxy(){
  const T=t();
  if(!isHttpOrigin()){ setConnState(false, T, "external"); return; }
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(), 4000);
  try{
    const base = (state.cfg.endpoint && state.cfg.endpoint.indexOf("http")===0)? state.cfg.endpoint : location.origin + "/run";
    const url = new URL("/api/health", base).href;
    const r=await fetch(url, {cache:"no-store", signal:ctrl.signal}); clearTimeout(timer);
    if(r.ok) setConnState(true, T, "ok"); else throw new Error("http "+r.status);
  }catch(e){ clearTimeout(timer); const aborted=!!(e && e.name==="AbortError"); setConnState(false, T, aborted? "timeout":"err"); }
}
// 冒烟自检（铁律 10）：挂载点 / 视图 / 组件存在性
function smokeCheck(){
  const issues=[];
  ["wb-hist-list","view-console","view-skills","view-history","qinput","sendBtn","wb-lang"].forEach(id=>{ if(!document.getElementById(id)) issues.push("缺失 #"+id); });
  if(typeof WBList==="undefined") issues.push("WBList 未加载（wb-list.js 缺失？）");
  if(issues.length) console.warn("[ct-advisor smoke] "+issues.join("；"));
  return issues;
}
