<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104" width="100%">
  <defs>
    <!-- ct-* 系列通用：圆弧角方框柔和投影 -->
    <filter id="logoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#1C6DD0" flood-opacity="0.30"/>
    </filter>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="4.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1C6DD0"/>
    </marker>
  </defs>

  <!-- 整体圆弧角方框（含柔和投影） -->
  <rect x="-52" y="-52" width="104" height="104" rx="20" fill="#EEEDFE" stroke="#C5DCF5" stroke-width="0.5" transform="translate(52,52)" filter="url(#logoShadow)"/>

  <!-- 左上角统一文字（ct-* 系列通用） -->
  <g transform="translate(7,13)">
    <text font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="900" font-style="italic" fill="#1C6DD0" stroke="#1C6DD0" stroke-width="0.25" paint-order="stroke" stroke-linejoin="round">Clinical</text>
    <text y="12" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="900" font-style="italic" fill="#1C6DD0" stroke="#1C6DD0" stroke-width="0.25" paint-order="stroke" stroke-linejoin="round">Trial</text>
  </g>

  <!-- ct-advisor 变体 A: 路由中枢 (中心四角星 + 四周子技能) -->
  <g fill="none" stroke="#1C6DD0" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arw)">
    <path d="M54 64 L36 46"/>
    <path d="M54 64 L72 46"/>
    <path d="M54 64 L38 82"/>
    <path d="M54 64 L70 82"/>
  </g>
  <circle cx="36" cy="46" r="6.5" fill="#9FE1CB" stroke="#1C6DD0" stroke-width="1.8"/>
  <circle cx="72" cy="46" r="6.5" fill="#D85A30" stroke="#1C6DD0" stroke-width="1.8"/>
  <circle cx="38" cy="82" r="6.5" fill="#AFA9EC" stroke="#1C6DD0" stroke-width="1.8"/>
  <circle cx="70" cy="82" r="6.5" fill="#C5DCF5" stroke="#1C6DD0" stroke-width="1.8"/>
  <circle cx="54" cy="64" r="14" fill="#1C6DD0" stroke="#1657A8" stroke-width="1"/>
  <path d="M54 54 L56.5 61.5 L64 64 L56.5 66.5 L54 74 L51.5 66.5 L44 64 L51.5 61.5 Z" fill="#FFFFFF"/>
</svg>
